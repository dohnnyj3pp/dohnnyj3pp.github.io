    <section class="projects-section">


      <div class="project-platform carousel">



        <!-- PROJECT LAUNCHER -->


        <div class="project-launcher">


          <div class="project-carousel">



            <div class="project-card" data-module="unavailable">

              <div class="project-thumbnail">
                COMING SOON
              </div>

            </div>




            <div class="project-card" data-module="available">


              <div class="project-thumbnail">

                <video id="portfolio-thumbnail" autoplay muted loop playsinline>

                  <source src="images/video/code.mp4" type="video/mp4">

                </video>

              </div>



              <div class="project-card-content">


                <h2>
                 PORTFOLIO
                </h2>


                <p>
                DEVELOPMENT
                </p>


              </div>


            </div>




            <div class="project-card" data-module="unavailable">

              <div class="project-thumbnail">
                COMING SOON
              </div>

            </div>



          </div>





          <div class="carousel-controls">


            <button class="carousel-prev">
              ◀ LAST
            </button>


            <button class="project-initialize">
              INITIALIZE
            </button>


            <button class="carousel-next">
              NEXT ▶
            </button>


          </div>



        </div>
                <!-- PROJECT WORKSPACE -->


        <div class="project-workspace">



          <aside class="project-hud offline">


            <div class="hud-thumbnail">

              <video id="hud-thumbnail" autoplay muted loop playsinline>

                <source src="images/video/code.mp4" type="video/mp4">

              </video>

            </div>



            <h2>
             portfolio 
            </h2>
            <p>Development</p>




            <div class="project-status">


              <div class="status-display">


                <span class="status-label">
                  STATUS:
                </span>


                <div class="status-line">


                  <span class="status-text">
                    OFFLINE
                  </span>


                </div>


              </div>



              <button class="project-return">
                RETURN
              </button>




              <div class="loading-container">


                <div class="loading-bar">


                  <div class="loading-fill"></div>


                  <span class="loading-label">
                    LOADING DATA
                  </span>


                </div>



                <span class="loading-percent">
                  0%
                </span>


              </div>



            </div>


          </aside>






          <div class="documentation-system">



            <div class="category-navigation">


              <button class="project-category active" data-category="languages">
                Core Languages
              </button>


              <button class="project-category" data-category="technologies">
                Tech & Features
              </button>


              <button class="project-category" data-category="development">
                Development
              </button>


              <button class="project-category" data-category="summary">
                Summary
              </button>


            </div>





            <div class="module-navigation"></div>





            <div class="documentation-viewer deploy-hidden">


              <div class="documentation-content"></div>


            </div>






            <!-- CODE MODAL -->


            <div class="code-modal" aria-hidden="true">


              <div class="code-modal-backdrop"></div>



              <div class="code-modal-panel">


                <div class="code-modal-header">


                  <div class="code-modal-title">
                    Code Preview
                  </div>



                  <button 
                    type="button"
                    class="code-modal-close"
                    aria-label="Close modal">
                    ×
                  </button>


                </div>





                <pre class="code-modal-snippet">
                  <code></code>
                </pre>





                <div 
                  class="code-modal-description"
                  aria-live="polite">
                </div>





                <div class="code-modal-note">

                  Press Esc or click outside to close.

                </div>



              </div>



            </div>



          </div>



        </div>


      </div>
