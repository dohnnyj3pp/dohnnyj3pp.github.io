  <!-- Main Content -->

  <main id="page-content" class="main-wrapper page-content">

    <section class="contact-section">

      <div class="contact-header">

        <span class="contact-eyebrow">
          COMMUNICATION CHANNEL
        </span>

        <h1>
          CONTACT
        </h1>

        <p>
          Interested in working together, discussing a project, or simply want to get in touch?
          Send me a message and I'll get back to you as soon as possible.
        </p>

      </div>

      <form
        class="contact-form"
        action="https://api.web3forms.com/submit"
        method="POST">

        <input
          type="hidden"
          name="access_key"
          value="7d8222ea-1c0b-462c-93ae-aa649d1c263d">

        <input
          type="hidden"
          name="subject"
          value="New Portfolio Contact">

        <input
          type="hidden"
          name="from_name"
          value="Adam Pace Portfolio">

        <input
          type="checkbox"
          name="botcheck"
          class="hidden"
          style="display:none">

        <div class="contact-field">

          <label for="contact-name">
            NAME
          </label>

          <input
            id="contact-name"
            name="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            required>

        </div>

        <div class="contact-field">

          <label for="contact-email">
            EMAIL
          </label>

          <input
            id="contact-email"
            name="email"
            type="email"
            placeholder="your@email.com"
            autocomplete="email"
            required>

        </div>

        <div class="contact-field">

          <label for="contact-message">
            MESSAGE
          </label>

          <textarea
            id="contact-message"
            name="message"
            placeholder="Enter your message..."
            rows="7"
            required></textarea>

        </div>

        <button
          class="contact-submit"
          type="submit">

          <span>
            SEND MESSAGE
          </span>

        </button>

        <div
          class="contact-status"
          aria-live="polite">
        </div>

      </form>

    </section>

  </main>

  <!-- Custom Cursor -->
